version: 2

updates:
  - package-ecosystem: npm # covers pnpm workspaces via pnpm-lock.yaml
    directory: /
    cooldown:
      default-days: 7 # let new releases age a week before they are proposed
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Types track the runtime (.nvmrc, Node 22); bump them with it, not on their own.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7 # let new releases age a week before they are proposed
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker # base image digests in apps/web/Dockerfile
    directory: /apps/web
    cooldown:
      default-days: 7 # let new releases age a week before they are proposed
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Node 22 LTS, matching .nvmrc and the distroless nodejs22 runtime; move both together.
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    cooldown:
      default-days: 7 # let new releases age a week before they are proposed
    schedule:
      interval: weekly
      day: monday
    ignore:
      # The database versions the integration tests target; a new major is a deliberate change.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: mysql
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
