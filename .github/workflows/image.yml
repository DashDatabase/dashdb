name: Image

# Builds the self-hosted image, checks its size, scans it with Trivy and, when `push` is true,
# pushes it to GHCR multi-arch with SBOM and provenance and signs it with cosign.
# Called by release.yml: with push for a release (write permissions), without for dry runs
# (read-only), so code from a pull request never runs with registry or signing credentials.

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false
      version:
        description: The version to tag (without the leading v), when pushing.
        type: string
        default: ''

permissions:
  contents: read

env:
  IMAGE: ghcr.io/dashdatabase/dashdb

jobs:
  image:
    name: Build, scan${{ inputs.push && ', push and sign' || ' (dry run)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ inputs.version }},enable=${{ inputs.push }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }},enable=${{ inputs.push }}
            type=raw,value=latest,enable=${{ inputs.push }}
            type=sha,enable=${{ !inputs.push }}

      # Scan before anything is pushed: a critical vulnerability with a fix stops the release.
      - name: Build for the scan (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          load: true
          tags: dashdb:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Compressed, as registries report it and users download it. Unpacked it is about 4.5x.
      - name: Check the image size (< 200 MB compressed)
        run: |
          bytes="$(docker save dashdb:scan | gzip -6 | wc -c)"
          unpacked="$(docker image inspect dashdb:scan --format '{{.Size}}')"
          echo "Image size: $((bytes / 1000000)) MB compressed, $((unpacked / 1000000)) MB unpacked" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$bytes" -lt 200000000 ] || { echo "::error::Image is over 200 MB compressed"; exit 1; }

      - name: Scan with Trivy (fail on critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dashdb:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # The app is compiled once on the runner's platform; the arm64 image only differs in its
      # sharp binaries (see the Dockerfile), so nothing is emulated.
      - name: Build multi-arch${{ inputs.push && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.push

      - name: Sign the image (keyless)
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
