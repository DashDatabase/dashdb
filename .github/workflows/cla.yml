name: CLA

# Contributors sign the Contributor License Agreement (CLA.md) once, by replying to the bot's
# comment on their first pull request. Signatures are stored in signatures/cla.json on the
# `cla-signatures` branch of this repository (unprotected, so the built-in token can write it).
# See CONTRIBUTING.md for why DashDB asks for a CLA.
#
# pull_request_target runs with write permissions on pull requests from forks, so this workflow
# must never check out or run code from the pull request. It only calls the CLA action, which
# reads the pull request's commits through the API.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write # re-runs the check after a contributor signs
  contents: write # commits signatures to the cla-signatures branch
  pull-requests: write # comments on the pull request
  statuses: write # sets the CLA status check

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && (github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/DashDatabase/dashdb/blob/main/CLA.md
          branch: cla-signatures
          # The maintainer holds the copyright already; bots don't contribute code of their own.
          allowlist: sidshehria,*[bot]
          lock-pullrequest-aftermerge: false
