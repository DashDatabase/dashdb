name: Release

# On main: Changesets opens (or updates) a "chore: version packages" PR from the pending
# changesets. Merging it bumps the version, so the next run tags v<version>, creates the GitHub
# release from the CHANGELOGs, and builds, scans, pushes and signs the image (image.yml).
# On pull requests that touch the release setup, and on manual runs, everything runs as a dry
# run with read-only permissions: changelogs are generated and the image is built and scanned,
# but nothing is pushed, tagged or signed.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .changeset/**
      - .dockerignore
      - .github/workflows/image.yml
      - .github/workflows/release.yml
      - apps/web/Dockerfile
      - apps/web/next.config.ts
      - apps/web/scripts/docker-architectures.mjs
      - docker-compose.selfhost.yml
      - pnpm-lock.yaml
      - scripts/release-notes.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version and GitHub release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # version commit, tag and release
      pull-requests: write # the version packages PR
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # This job holds a write token, so dependency install scripts don't run: nothing here
      # needs them (Changesets and release-notes.mjs are plain Node).
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Only opens or updates the version PR. Changesets v3 no longer prints the "New tag:" lines
      # this action parses to publish, so tagging and the GitHub release are done below.
      - name: Open or update the version packages PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to release
        id: plan
        env:
          HAS_CHANGESETS: ${{ steps.changesets.outputs.has-changesets }}
        run: |
          version="$(node -p "require('./apps/web/package.json').version")"
          release=false
          # A release happens once the version PR is merged: no changesets left, and a version
          # that has no tag yet. 0.0.0 means nothing has been released.
          if [ "$version" != 0.0.0 ] && [ "$HAS_CHANGESETS" != true ] \
            && ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version release=$release"

      - name: Create the tag and GitHub release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          node scripts/release-notes.mjs "$VERSION" | tee notes.md >> "$GITHUB_STEP_SUMMARY"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file notes.md

  image:
    name: Image
    needs: version
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signing
    uses: ./.github/workflows/image.yml
    with:
      push: true
      version: ${{ needs.version.outputs.version }}

  dry-run:
    name: 'Dry run: version and release notes'
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # As in the version job, so the dry run checks the same install.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply the pending changesets locally
        run: |
          pnpm changeset version
          git status --short
      - name: Release notes the next release would get
        run: |
          version="$(node -p "require('./apps/web/package.json').version")"
          echo "Next version: $version" | tee -a "$GITHUB_STEP_SUMMARY"
          node scripts/release-notes.mjs "$version" | tee -a "$GITHUB_STEP_SUMMARY"

  image-dry-run:
    name: 'Dry run: image'
    if: github.event_name != 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/image.yml
    with:
      push: false
