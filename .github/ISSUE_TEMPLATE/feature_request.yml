name: Feature request
description: Suggest a new feature, format, database or safety rule.
title: 'feat: '
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like DashDB to do? Mock-ups, example schemas or SQL are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Other tools or approaches you have tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor / canvas
        - Import / export formats
        - Migrations
        - Safety rules
        - Self-hosting
        - Docs
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.
