# Local development services only. Credentials here are throwaway dev defaults.
name: dashdb

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dashdb
      POSTGRES_PASSWORD: dashdb
      POSTGRES_DB: dashdb
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dashdb -d dashdb']
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:26.7
    environment:
      MYSQL_ROOT_PASSWORD: dashdb
      MYSQL_USER: dashdb
      MYSQL_PASSWORD: dashdb
      MYSQL_DATABASE: dashdb_sample
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
  mysql-data:
  redis-data:
