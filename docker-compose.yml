# Databases for the round-trip integration tests (`pnpm test:db`). Credentials here are throwaway
# dev defaults.
name: dashdb

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dashdb
      POSTGRES_PASSWORD: dashdb
      POSTGRES_DB: dashdb
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dashdb -d dashdb']
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dashdb
      MYSQL_USER: dashdb
      MYSQL_PASSWORD: dashdb
      MYSQL_DATABASE: dashdb_sample
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  mysql-data:
